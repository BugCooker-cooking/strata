name: Bug report
description: Report a reproducible Strata problem
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Strata version, hardware, and model/provider if used. Never include API keys or private images.
    validations:
      required: true
