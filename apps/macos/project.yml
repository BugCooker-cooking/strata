name: Strata
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode's parallel WMO otherwise starts a backend per CPU independently of
    # -jobs. Keep optimized Swift within the user's local build task limit.
    SWIFT_USE_PARALLEL_WHOLE_MODULE_OPTIMIZATION: NO
    # M0 ships the local arm64 prototype only; universal binaries are an M8 task.
    ARCHS: arm64
targets:
  Strata:
    type: application
    platform: macOS
    sources:
      - path: Strata
      - path: Generated
        excludes: ["*.h", "*.modulemap", "Info.plist"]
      - path: ../../docs/design/assets/sample-photo.jpg
        buildPhase: resources
      - path: ../../crates/strata-text/assets/fonts/LICENSE-Noto-Latin.txt
        buildPhase: resources
      - path: ../../crates/strata-text/assets/fonts/LICENSE-Noto-CJK.txt
        buildPhase: resources
      - path: ../../crates/strata-text/assets/fonts/SOURCES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.strata-editor.Strata
        INFOPLIST_KEY_CFBundleDisplayName: Strata
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Generated"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/strata_ffiFFI.modulemap"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/../../target/debug/libstrata_ffi.a"
        Release:
          OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/../../target/release/libstrata_ffi.a"
    info:
      path: Generated/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        # User-configured HTTP endpoints require an explicit per-provider opt-in
        # in the Rust URL validator and native model settings.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.strata-editor.project
            UTTypeDescription: Strata Project
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [strata]
    dependencies:
      - sdk: AppKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: ImageIO.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
    preBuildScripts:
      - name: Build Rust and Swift bindings
        script: 'bash "$SRCROOT/../../scripts/build-rust.sh" "$CONFIGURATION"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed verified subject runtime
        script: 'bash "$SRCROOT/../../scripts/embed-ml-runtime.sh"'
        basedOnDependencyAnalysis: false
  StrataTests:
    type: bundle.unit-test
    platform: macOS
    sources: [StrataTests]
    dependencies:
      - target: Strata
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.strata-editor.StrataTests
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/strata_ffiFFI.modulemap"
schemes:
  Strata:
    build:
      targets:
        Strata: all
    test:
      targets: [StrataTests]
