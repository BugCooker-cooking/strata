[workspace]
resolver = "3"
members = ["crates/strata-core", "crates/strata-pixels", "crates/strata-color", "crates/strata-io", "crates/strata-platform", "crates/strata-render", "crates/strata-ffi", "crates/strata-ai", "tools/uniffi-bindgen", "tools/strata-devtool"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/BugCooker-cooking/strata"

# The local Rust 1.97.1/macOS toolchain fails to load some Release proc-macro
# dylibs with the default debug=0 build profile. Keep debug metadata in HOST
# build dependencies only; application/runtime crates remain Release optimized.
[profile.release.build-override]
debug = true

[workspace.dependencies]
strata-pixels = { path = "crates/strata-pixels" }
strata-core = { path = "crates/strata-core" }
strata-color = { path = "crates/strata-color" }
strata-io = { path = "crates/strata-io" }
strata-render = { path = "crates/strata-render" }
strata-platform = { path = "crates/strata-platform" }
strata-ai = { path = "crates/strata-ai" }
uniffi = "0.32.2"
wgpu = "30.0.1"
lcms2 = { version = "6.2.0", features = ["static"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
thiserror = "2"
tempfile = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2.3", features = ["uuid1"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
sha2 = "0.11.1"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
tiff = "0.11.3"
png = "0.18.1"
webp = { version = "0.3.1", default-features = false }
libc = "0.2"
url = "2.5"
base64 = "0.22"
